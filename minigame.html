<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>HYU PREMIUM — Artwork Minigame</title>
  <style>
    :root{color-scheme:dark;--bg:#090909;--panel:#111;--line:rgba(255,255,255,.12);--muted:rgba(255,255,255,.58);--text:#f5f5f5;--accent:#fff}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;padding:clamp(18px,4vw,44px)}
    main{width:min(980px,100%);margin:0 auto}
    .eyebrow{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--muted)}
    h1{margin:0;font-size:clamp(34px,7vw,72px);line-height:.98;letter-spacing:-.04em}
    .intro{max-width:650px;margin:16px 0 28px;color:var(--muted);line-height:1.65}
    .stage{position:relative;display:grid;place-items:center;min-height:min(68vh,680px);overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 22px 70px rgba(0,0,0,.3)}
    .artwork{display:none;width:100%;height:100%;max-height:min(72vh,760px);object-fit:contain}
    .stage.ready .artwork{display:block;animation:art-in .2s ease-out}
    .placeholder{display:grid;place-items:center;gap:8px;text-align:center;color:var(--muted)}
    .stage.ready .placeholder{display:none}
    .placeholder strong{font-size:clamp(84px,18vw,170px);line-height:1}
    .placeholder span{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
    button{min-height:54px;padding:14px 20px;border:1px solid var(--line);border-radius:999px;font:inherit;font-weight:800;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
    button:hover:not(:disabled){transform:translateY(-1px)}
    button:disabled{cursor:not-allowed;opacity:.35}
    #roll{background:var(--accent);color:#080808}
    #reveal{background:#171717;color:var(--text)}
    .answer{display:flex;min-height:84px;align-items:center;justify-content:center;gap:10px;margin-top:12px;padding:18px 22px;border:1px solid var(--line);border-radius:18px;background:#101010;text-align:center}
    .answer-label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    #answer{font-size:clamp(24px,4vw,36px);font-weight:900}
    .status{margin:12px 4px 0;font-size:12px;color:var(--muted)}
    .error{color:#ff9d9d}
    @keyframes art-in{from{opacity:0;transform:scale(.994)}to{opacity:1;transform:scale(1)}}
    @media(max-width:680px){body{padding:18px 12px 34px}.stage{min-height:54vh;border-radius:18px}.actions{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">HYU PREMIUM / MINIGAME</p>
    <h1>Đây là artwork của ai?</h1>
    <p class="intro">Roll một artwork ngẫu nhiên từ thư viện HYU PREMIUM, đoán nhân vật rồi mở đáp án để kiểm tra.</p>

    <section class="stage" id="stage" aria-live="polite">
      <div class="placeholder"><strong>?</strong><span>Nhấn Roll để bắt đầu</span></div>
      <img id="artwork" class="artwork" alt="Artwork bí ẩn trong HYU PREMIUM" decoding="async">
    </section>

    <div class="actions">
      <button id="roll" type="button" disabled>Đang tải dữ liệu...</button>
      <button id="reveal" type="button" disabled>Reveal answer</button>
    </div>

    <div class="answer">
      <span class="answer-label">Đáp án</span>
      <strong id="answer">•••</strong>
    </div>
    <p id="status" class="status">Đang đọc catalogue từ repository...</p>
  </main>

  <script>
    (()=>{
      const stage=document.getElementById('stage');
      const artwork=document.getElementById('artwork');
      const roll=document.getElementById('roll');
      const reveal=document.getElementById('reveal');
      const answer=document.getElementById('answer');
      const status=document.getElementById('status');
      let items=[];
      let currentIndex=-1;

      const imageOf=item=>item.thumbnail||item.variants?.['1600']?.url||item.image||'';

      function pickIndex(){
        if(items.length<=1)return 0;
        let next=Math.floor(Math.random()*items.length);
        while(next===currentIndex)next=Math.floor(Math.random()*items.length);
        return next;
      }

      function rollArtwork(){
        if(!items.length)return;
        currentIndex=pickIndex();
        const item=items[currentIndex];
        artwork.src=imageOf(item);
        artwork.alt='Artwork bí ẩn trong HYU PREMIUM';
        stage.classList.add('ready');
        answer.textContent='•••';
        reveal.disabled=false;
        roll.textContent='Roll artwork khác';
        status.textContent=`Đã tải ${items.length} artwork khả dụng.`;
      }

      roll.addEventListener('click',rollArtwork);
      reveal.addEventListener('click',()=>{
        if(currentIndex<0)return;
        answer.textContent=items[currentIndex].category;
        reveal.disabled=true;
      });

      fetch('./data/backend/catalogue.json',{cache:'no-store'})
        .then(response=>{
          if(!response.ok)throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(data=>{
          items=(Array.isArray(data.items)?data.items:[]).filter(item=>!item.hidden&&item.category&&imageOf(item));
          if(!items.length)throw new Error('Catalogue không có artwork khả dụng');
          roll.disabled=false;
          roll.textContent='Roll artwork';
          status.textContent=`Sẵn sàng · ${items.length} artwork.`;
        })
        .catch(error=>{
          status.textContent=`Không thể tải catalogue: ${error.message}`;
          status.classList.add('error');
          roll.textContent='Không tải được dữ liệu';
        });
    })();
  </script>
</body>
</html>
