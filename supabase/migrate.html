<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>HYU PREMIUM Supabase Migration</title>
<style>body{margin:0;background:#0b0d10;color:#eef2f6;font:14px/1.5 Arial,sans-serif}.wrap{max-width:760px;margin:40px auto;padding:20px}.panel{background:#11151a;border:1px solid #28303a;border-radius:10px;padding:18px;margin-bottom:14px}h1{margin-top:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,button{font:inherit}.input{width:100%;height:42px;box-sizing:border-box;background:#0d1115;color:#eef2f6;border:1px solid #28303a;border-radius:6px;padding:0 10px}.btn{border:1px solid #28303a;background:#1a2027;color:#eef2f6;border-radius:6px;padding:10px 14px;cursor:pointer}.primary{background:#43dcff;color:#061016;border-color:#43dcff;font-weight:800}.status{white-space:pre-wrap;color:#9ca8b3}code{color:#aeeeff}@media(max-width:600px){.row{grid-template-columns:1fr}}</style>
</head>
<body><div class="wrap"><h1>HYU PREMIUM / Supabase Migration</h1>
<div class="panel"><p>This one-time tool imports the existing GitHub JSON catalogue into Supabase. It requires a Supabase Auth account already listed in <code>public.admins</code>.</p><div class="row"><input class="input" id="email" type="email" placeholder="Owner email"><input class="input" id="password" type="password" placeholder="Password"></div><p><button class="btn" id="login">Sign in</button> <button class="btn primary" id="migrate" disabled>Import current catalogue</button></p><div class="status" id="status">Supabase configuration is not checked yet.</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script>
const $=s=>document.querySelector(s),cfg=window.HYU_SUPABASE_CONFIG||{};let client=null;
function status(m){$('#status').textContent=m}
if(cfg.enabled&&cfg.url&&cfg.publishableKey){client=window.supabase.createClient(cfg.url,cfg.publishableKey);status('Configuration loaded. Sign in as the owner.')}else status('Supabase is disabled. Fill assets/js/supabase-config.js first.');
async function ensureAdmin(){const {data:{user},error}=await client.auth.getUser();if(error||!user)throw new Error('Not signed in.');const {data,error:adminErr}=await client.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(adminErr)throw adminErr;if(!data)throw new Error('This Auth user is not listed in public.admins.');return user}
$('#login').onclick=async()=>{try{if(!client)throw new Error('Supabase configuration is disabled.');status('Signing in...');const {error}=await client.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)throw error;const user=await ensureAdmin();$('#migrate').disabled=false;status(`Signed in as ${user.email}. Ready to import.`)}catch(e){status(e.message)}};
$('#migrate').onclick=async()=>{try{await ensureAdmin();status('Loading legacy JSON...');const [items,opts]=await Promise.all([fetch('../data/artworks.json',{cache:'no-store'}).then(r=>r.json()),fetch('../data/options.json',{cache:'no-store'}).then(r=>r.json())]);const categories=[...new Set([...(opts.categories||[]),...items.map(x=>x.category).filter(Boolean)])];const credits=[...new Set([...(opts.credits||[]),...items.map(x=>x.credit).filter(Boolean)])];const ranks=[...new Set([...(opts.ranks||[]),...items.map(x=>x.rank).filter(Boolean)])];status('Creating category, credit and rank choices...');let r=await client.from('categories').upsert(categories.map(name=>({name})),{onConflict:'name'});if(r.error)throw r.error;r=await client.from('image_credits').upsert(credits.map(name=>({name})),{onConflict:'name'});if(r.error)throw r.error;r=await client.from('ranks').upsert(ranks.map((name,sort_order)=>({name,sort_order})),{onConflict:'name'});if(r.error)throw r.error;const [cats,creds,rankRows]=await Promise.all([client.from('categories').select('id,name'),client.from('image_credits').select('id,name'),client.from('ranks').select('id,name')]);if(cats.error)throw cats.error;if(creds.error)throw creds.error;if(rankRows.error)throw rankRows.error;const cm=new Map(cats.data.map(x=>[x.name,x.id])),crm=new Map(creds.data.map(x=>[x.name,x.id])),rm=new Map(rankRows.data.map(x=>[x.name,x.id]));const rows=items.map(x=>({id:x.id,name:x.name,description:x.description||'',category_id:cm.get(x.category),rank_id:rm.get(x.rank),credit_id:crm.get(x.credit),image:x.image,tags:Array.isArray(x.tags)?x.tags:[],hidden:Boolean(x.hidden)}));status(`Importing ${rows.length} artworks...`);r=await client.from('artworks').upsert(rows,{onConflict:'id'});if(r.error)throw r.error;status(`Migration complete: ${rows.length} artworks, ${categories.length} categories, ${credits.length} credits, ${ranks.length} ranks.`)}catch(e){status(`Migration failed: ${e.message}`)}};
</script></body></html>
