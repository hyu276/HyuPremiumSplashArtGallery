name: Runtime Supabase audit

on:
  push:
    branches:
      - hardening/egress-zero
    paths:
      - '.github/workflows/runtime-supabase-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan deployable runtime tree
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const roots=['app','components','lib','assets'];
          const exts=new Set(['.ts','.tsx','.js','.mjs','.cjs','.html']);
          const files=[];
          function walk(p){
            if(!fs.existsSync(p)) return;
            const st=fs.statSync(p);
            if(st.isDirectory()) for(const name of fs.readdirSync(p)) walk(path.join(p,name));
            else if(exts.has(path.extname(p))) files.push(p);
          }
          for(const root of roots) walk(root);
          for(const name of fs.readdirSync('.')) if(name.endsWith('.html')&&fs.statSync(name).isFile()) files.push(name);
          const rules=[
            /https?:\/\/[^\s"']*supabase\.co/i,
            /storage\/v1\/object\/public/i,
            /@supabase\/supabase-js/i,
            /NEXT_PUBLIC_[A-Z0-9_]*SUPABASE/i,
            /supabase-js@/i
          ];
          const hits=[];
          for(const file of files){
            const text=fs.readFileSync(file,'utf8');
            const lines=text.split(/\r?\n/);
            lines.forEach((line,i)=>{if(rules.some(r=>r.test(line)))hits.push(`${file}:${i+1}:${line.trim().slice(0,240)}`)});
          }
          if(hits.length){console.error(hits.join('\n'));console.error(`Supabase runtime/reference paths remain: ${hits.length}`);process.exit(1)}
          console.log(`Runtime audit passed across ${files.length} deployable source files: no Supabase request/client paths.`);
          NODE
