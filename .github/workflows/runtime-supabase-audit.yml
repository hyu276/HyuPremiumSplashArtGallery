name: Runtime Supabase audit

on:
  push:
    branches:
      - hardening/egress-zero
    paths:
      - '.github/workflows/runtime-supabase-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan deployable runtime tree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find app components lib assets -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.html' \) -print; find . -maxdepth 1 -type f -name '*.html' -print)
          patterns='https?://[^[:space:]"'"']*supabase\.co|storage/v1/object/public|@supabase/supabase-js|NEXT_PUBLIC_[A-Z0-9_]*SUPABASE|supabase-js@'
          if grep -nEi "$patterns" "${files[@]}"; then
            echo 'Supabase runtime/reference path remains in deployable files.' >&2
            exit 1
          fi
          echo "Runtime audit passed across ${#files[@]} deployable source files: no Supabase request/client paths."
