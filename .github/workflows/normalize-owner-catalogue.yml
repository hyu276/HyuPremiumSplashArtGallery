name: Normalize HYU catalogue to owner-only

on:
  workflow_dispatch:
  push:
    branches:
      - migrate/github-metadata-cloudflare-r2
    paths:
      - 'scripts/normalize-owner-catalogue.mjs'
      - '.github/workflows/normalize-owner-catalogue.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: migrate/github-metadata-cloudflare-r2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize catalogue ownership
        run: node scripts/normalize-owner-catalogue.mjs
      - name: Verify no collaborator metadata remains
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('data/backend/catalogue.json','utf8'));
          if(!Array.isArray(data.items)||data.items.length<171)throw new Error('Catalogue item count is lower than expected.');
          if(data.sourceOptions)throw new Error('sourceOptions still exists.');
          const residual=data.items.filter(x=>'source' in x||'sourceId' in x);
          if(residual.length)throw new Error(`Residual source metadata: ${residual.length}`);
          console.log(`Verified ${data.items.length} artworks; collaborator mechanism removed.`);
          NODE
      - name: Commit normalized snapshot
        run: |
          set -euo pipefail
          if git diff --quiet -- data/backend/catalogue.json; then
            echo 'Catalogue already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backend/catalogue.json
          git commit -m 'data: consolidate collaborator artworks under owner catalogue'
          git push origin HEAD:migrate/github-metadata-cloudflare-r2
