name: Cutover network validation

on:
  push:
    branches:
      - hardening/egress-zero
    paths:
      - '.github/workflows/cutover-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify Cloudflare MISS then HIT in one POP
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/candidates.txt
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('data/backend/catalogue.json','utf8'));
          for(const item of [...c.items].reverse()){
            for(const width of ['640','960','1600']){
              const url=item?.variants?.[width]?.url;
              if(url) console.log(`${item.id}\t${width}\t${url}`);
            }
          }
          NODE
          success=0
          while IFS=$'\t' read -r id width url; do
            : > /tmp/first.headers
            : > /tmp/second.headers
            curl --http2 --fail --silent --show-error --dump-header /tmp/first.headers --output /dev/null "$url" \
              --next --http2 --fail --silent --show-error --dump-header /tmp/second.headers --output /dev/null "$url"
            first_cache=$(awk 'BEGIN{IGNORECASE=1} /^x-hyu-cache:/{gsub("\r","");print $2;exit}' /tmp/first.headers)
            second_cache=$(awk 'BEGIN{IGNORECASE=1} /^x-hyu-cache:/{gsub("\r","");print $2;exit}' /tmp/second.headers)
            first_colo=$(awk 'BEGIN{IGNORECASE=1} /^cf-ray:/{gsub("\r","");split($2,a,"-");print a[2];exit}' /tmp/first.headers)
            second_colo=$(awk 'BEGIN{IGNORECASE=1} /^cf-ray:/{gsub("\r","");split($2,a,"-");print a[2];exit}' /tmp/second.headers)
            echo "cache probe $id/$width: $first_cache@$first_colo -> $second_cache@$second_colo"
            if [[ "$first_cache" == "MISS" && "$second_cache" == "HIT" && -n "$first_colo" && "$first_colo" == "$second_colo" ]]; then
              grep -Eiq '^cache-control:.*max-age=31536000.*immutable' /tmp/second.headers
              echo '--- validated first response ---'; cat /tmp/first.headers
              echo '--- validated second response ---'; cat /tmp/second.headers
              success=1
              break
            fi
          done < /tmp/candidates.txt
          test "$success" -eq 1
      - name: Verify HTTP Range 206
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_URL=$(node -e "const c=require('./data/backend/catalogue.json'); console.log(c.items[c.items.length-1].media.original.url)")
          curl --fail --silent --show-error -H 'Range: bytes=0-1023' -D /tmp/range.headers -o /tmp/range.bin "$ORIGINAL_URL"
          echo '--- range response ---'
          cat /tmp/range.headers
          test "$(wc -c < /tmp/range.bin)" -eq 1024
          grep -Eq '^HTTP/[^ ]+[[:space:]]+206' /tmp/range.headers
          grep -Eiq '^content-range:[[:space:]]*bytes 0-1023/' /tmp/range.headers
          grep -Eiq '^accept-ranges:[[:space:]]*bytes' /tmp/range.headers
          grep -Eiq '^x-hyu-cache:[[:space:]]*RANGE' /tmp/range.headers
