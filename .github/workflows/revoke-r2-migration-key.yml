name: Revoke HYU R2 migration key

on:
  push:
    branches:
      - migrate/github-metadata-cloudflare-r2
    paths:
      - '.github/workflows/revoke-r2-migration-key.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_CONFIG: cloudflare/r2-media-worker/wrangler.jsonc
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revoke migration secret
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | npx --yes wrangler@latest secret delete MIGRATION_KEY --config "$WRANGLER_CONFIG"
      - name: Verify migration secret is absent
        shell: bash
        run: |
          set -euo pipefail
          secrets=$(npx --yes wrangler@latest secret list --config "$WRANGLER_CONFIG")
          if printf '%s' "$secrets" | grep -q 'MIGRATION_KEY'; then
            echo '::error::MIGRATION_KEY still exists after revocation.'
            exit 1
          fi
          echo 'MIGRATION_KEY successfully revoked.'
