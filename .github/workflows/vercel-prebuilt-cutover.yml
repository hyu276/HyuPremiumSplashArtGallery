name: Vercel prebuilt production cutover

on:
  push:
    branches:
      - hardening/egress-zero
    paths:
      - '.github/workflows/vercel-prebuilt-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_nrydvozbCX4IedRwEENB4qpn
  VERCEL_PROJECT_ID: prj_o6cQv5rslv0Kt29HKksvsKGtO7wF

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Vercel token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_TOKEN secret is not configured.' >&2
            exit 2
          fi
          echo 'VERCEL_TOKEN secret is configured.'
      - uses: actions/checkout@v6
        with:
          ref: 3e0f843f5b2f908583d795db93c72c39659adc29
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and Vercel CLI
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund vercel@latest
      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: ./node_modules/.bin/vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production output locally
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: ./node_modules/.bin/vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt output to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: ./node_modules/.bin/vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
