name: Egress safety

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - hardening/egress-zero
      - hardening/egress-no-domain-v2
      - hardening/egress-seo-orphan-v3

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Egress regression gate
        run: npm run egress:check
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Build GitHub Pages admin bundle
        run: npm run admin:build
      - name: Upload admin bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-bundle
          path: assets/js/admin-github.bundle.js
          retention-days: 1
