name: Catalogue publish guard

on:
  push:
    branches:
      - main
    paths:
      - 'data/backend/catalogue.json'
      - '.github/workflows/catalogue-publish-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue-publish-guard-main
  cancel-in-progress: false

jobs:
  validate-and-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and repair public catalogue media
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/backend/catalogue.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const items = Array.isArray(data.items) ? data.items : [];
          const broken = [];
          for (const item of items) {
            if (item && item.hidden !== true && !String(item.image || '').trim()) {
              broken.push({ id: String(item.id || ''), name: String(item.name || '') });
              item.hidden = true;
              item.updatedAt = new Date().toISOString();
            }
          }
          if (!broken.length) {
            console.log('Catalogue guard: no malformed public artwork found.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=false\n');
            process.exit(0);
          }
          data.generatedAt = new Date().toISOString();
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          console.log('Catalogue guard repaired malformed public entries:', broken);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=true\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `repaired=${broken.map(x => x.id).join(',')}\n`);
          NODE
      - name: Validate repaired catalogue with production safety gate
        if: steps.repair.outputs.changed == 'true'
        run: npm run egress:check
      - name: Commit repaired catalogue
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backend/catalogue.json
          git commit -m "fix(catalogue): quarantine malformed public artwork"
          git push origin HEAD:main
      - name: Report healthy catalogue
        if: steps.repair.outputs.changed != 'true'
        run: echo 'Catalogue publish guard passed without repair.'
