name: Catalogue publish guard

on:
  push:
    branches:
      - main
    paths:
      - 'data/backend/catalogue.json'
      - '.github/workflows/catalogue-publish-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue-publish-guard-main
  cancel-in-progress: false

jobs:
  validate-and-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and quarantine malformed catalogue media
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cataloguePath = 'data/backend/catalogue.json';
          const quarantinePath = 'data/backend/catalogue-quarantine.json';
          const data = JSON.parse(fs.readFileSync(cataloguePath, 'utf8'));
          const items = Array.isArray(data.items) ? data.items : [];
          const malformed = items.filter(item => item && !String(item.image || '').trim());
          if (!malformed.length) {
            console.log('Catalogue guard: no malformed artwork found.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=false\n');
            process.exit(0);
          }

          const malformedIds = new Set(malformed.map(item => String(item.id || '')));
          data.items = items.filter(item => !malformedIds.has(String(item?.id || '')));
          data.generatedAt = new Date().toISOString();
          fs.writeFileSync(cataloguePath, JSON.stringify(data, null, 2) + '\n');

          let quarantine = { schemaVersion: 1, updatedAt: '', items: [] };
          if (fs.existsSync(quarantinePath)) {
            try { quarantine = JSON.parse(fs.readFileSync(quarantinePath, 'utf8')); } catch {}
          }
          const existing = new Map((Array.isArray(quarantine.items) ? quarantine.items : []).map(item => [String(item.id || ''), item]));
          const quarantinedAt = new Date().toISOString();
          for (const item of malformed) {
            existing.set(String(item.id || ''), {
              ...item,
              quarantine: {
                reason: 'missing-image',
                quarantinedAt,
                source: 'catalogue-publish-guard'
              }
            });
          }
          quarantine = { schemaVersion: 1, updatedAt: quarantinedAt, items: [...existing.values()] };
          fs.writeFileSync(quarantinePath, JSON.stringify(quarantine, null, 2) + '\n');

          console.log('Catalogue guard quarantined malformed entries:', malformed.map(item => ({ id: item.id, name: item.name })));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=true\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `repaired=${malformed.map(x => x.id).join(',')}\n`);
          NODE
      - name: Validate repaired catalogue with production safety gate
        if: steps.repair.outputs.changed == 'true'
        run: npm run egress:check
      - name: Commit repaired catalogue and quarantine
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backend/catalogue.json data/backend/catalogue-quarantine.json
          git commit -m "fix(catalogue): quarantine malformed artwork outside production data"
          git push origin HEAD:main
      - name: Report healthy catalogue
        if: steps.repair.outputs.changed != 'true'
        run: echo 'Catalogue publish guard passed without repair.'

