name: Verify and package live catalogue fix
on:
  push:
    branches:
      - fix/live-catalogue-credit-sync
permissions:
  contents: write
concurrency:
  group: catalogue-fix-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-catalogue-credit-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund
      - name: Live GitHub catalogue source smoke test
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.github.com/repos/hyu276/HyuPremiumSplashArtGallery';
          const response=await fetch(base+'/commits?path=data%2Fbackend%2Fcatalogue.json&per_page=1',{headers:{Accept:'application/vnd.github+json','User-Agent':'HYU-catalogue-probe'}});
          if(!response.ok)throw Error('GitHub commit endpoint HTTP '+response.status);
          const [commit]=await response.json();
          if(!/^[a-f0-9]{40}$/.test(commit?.sha||''))throw Error('Invalid latest metadata commit SHA');
          const url='https://raw.githubusercontent.com/hyu276/HyuPremiumSplashArtGallery/'+commit.sha+'/data/backend/catalogue.json';
          const raw=await fetch(url);
          if(!raw.ok)throw Error('Immutable catalogue HTTP '+raw.status);
          const data=await raw.json();
          if(data.ready!==true||!Array.isArray(data.items)||!data.items.length)throw Error('Invalid runtime catalogue JSON');
          if(data.items.some(item=>item.credit==='Tâm')||data.credits.includes('Tâm'))throw Error('Old credit Tâm still exists in GitHub metadata');
          console.log('GitHub catalogue revision',commit.sha.slice(0,8),'artwork count',data.items.length);
          NODE
      - name: Egress safety gates
        run: npm run egress:check
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Build GitHub Pages admin JavaScript
        run: npm run admin:build
      - name: Verify bundle syntax
        run: |
          test -s assets/js/admin-github.bundle.js
          node --check assets/js/admin-github.bundle.js
      - name: Commit admin bundle to feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/js/admin-github.bundle.js; then
            echo 'Admin bundle unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/admin-github.bundle.js
          git commit -m "build(admin): bundle public catalogue sync verification"
          git pull --rebase origin fix/live-catalogue-credit-sync
          git push origin HEAD:fix/live-catalogue-credit-sync
