name: Patch admin orphan cleanup

on:
  push:
    branches: [hardening/egress-seo-orphan-v3]
    paths:
      - 'scripts/patch-admin-orphan-cleanup.mjs'
      - '.github/workflows/patch-admin-orphan-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-admin-orphan-cleanup
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/egress-seo-orphan-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic patch
        run: node scripts/patch-admin-orphan-cleanup.mjs
      - name: Commit patched dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/GitHubAdminDashboard.tsx
          git diff --cached --quiet && { echo 'No patch output'; exit 1; }
          git commit -m 'hardening: garbage collect replaced media derivatives'
          git pull --rebase origin hardening/egress-seo-orphan-v3
          git push origin HEAD:hardening/egress-seo-orphan-v3
