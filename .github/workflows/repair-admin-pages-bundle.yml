name: Repair admin Pages bundle

on:
  push:
    branches:
      - fix/admin-pages-bootstrap

permissions:
  contents: write

jobs:
  verify-and-build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/admin-pages-bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Egress regression gate
        run: npm run egress:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build admin bundle
        run: npm run admin:build
      - name: Assert admin bootstrap exists
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Admin root element missing" assets/js/admin-github.bundle.js
          grep -q "root" assets/js/admin-github.bundle.js
      - name: Production build
        run: npm run build
      - name: Commit rebuilt admin bundle and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json admin.html assets/js/admin-github.bundle.js
          git rm .github/workflows/repair-admin-pages-bundle.yml
          git commit -m "fix(admin): restore GitHub Pages bootstrap"
          git push origin HEAD:fix/admin-pages-bootstrap
