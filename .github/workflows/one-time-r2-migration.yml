name: One-time Supabase and external media migration to R2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-r2-migration.yml'
      - 'scripts/r2-migration-manifest.json'
      - 'scripts/migrate-r2-residual.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-time-r2-storage-cleanup
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MEDIA_BASE: https://hyu-premium-media.csquocnguyen.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - name: Install Wrangler
        shell: bash
        run: npm install --global wrangler@latest
      - name: Copy and verify every object
        shell: bash
        run: node scripts/migrate-r2-residual.mjs
