name: Prepare credit sync admin bundle
on:
  push:
    branches:
      - fix/credit-publish-freshness-2
permissions:
  contents: write
jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/credit-publish-freshness-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build admin bundle
        run: npm run admin:build
      - name: Validate bundle
        run: |
          test -s assets/js/admin-github.bundle.js
          node --check assets/js/admin-github.bundle.js
      - name: Commit bundle to feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/js/admin-github.bundle.js; then
            echo 'Admin bundle is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/admin-github.bundle.js
          git commit -m "build(admin): prepare credit persistence verification"
          git pull --rebase origin fix/credit-publish-freshness-2
          git push origin HEAD:fix/credit-publish-freshness-2
