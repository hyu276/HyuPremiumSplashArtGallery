name: Apply egress v2 code patch

on:
  push:
    branches:
      - hardening/egress-no-domain-v2
    paths:
      - 'scripts/apply-egress-v2-code.mjs'
      - '.github/workflows/apply-egress-v2-code.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-egress-v2-code
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/egress-no-domain-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic patch
        run: node scripts/apply-egress-v2-code.mjs
      - name: Commit patched runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/GitHubAdminDashboard.tsx app/api/admin-backend/route.ts
          git diff --cached --quiet && { echo 'No patch output'; exit 1; }
          git commit -m 'hardening: centralize derivative generation on backend'
          git pull --rebase origin hardening/egress-no-domain-v2
          git push origin HEAD:hardening/egress-no-domain-v2
