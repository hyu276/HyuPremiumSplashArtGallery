name: Build admin artifact

on:
  push:
    branches:
      - feat/admin-taxonomy

permissions:
  contents: write

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/admin-taxonomy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck source
        run: npm run typecheck
      - name: Build GitHub Pages admin bundle
        run: npm run admin:build
      - name: Commit built admin artifact and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/admin-github.bundle.js
          git rm .github/workflows/build-admin-artifact.yml
          git commit -m "chore(admin): build GitHub Pages bundle"
          git push origin HEAD:feat/admin-taxonomy
