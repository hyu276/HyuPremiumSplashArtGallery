name: Migrate HYU backend to GitHub + R2

on:
  workflow_dispatch:
  push:
    branches:
      - migrate/github-metadata-cloudflare-r2
    paths:
      - '.github/workflows/migrate-backend-to-r2.yml'
      - 'cloudflare/r2-media-worker/**'
      - 'scripts/migrate-supabase-to-r2.mjs'
      - 'scripts/finalize-github-backend.mjs'
      - 'data/backend/migration-seed.json'

permissions:
  contents: write

concurrency:
  group: hyu-r2-backend-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message || '', '[r2-migration-data]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_CONFIG: cloudflare/r2-media-worker/wrangler.jsonc
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare GitHub connection
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::Cloudflare credentials are not available to GitHub Actions. Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as repository/environment secrets, then re-run this workflow.'
            exit 1
          fi

      - name: Ensure R2 bucket exists
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes wrangler@latest r2 bucket list --config "$WRANGLER_CONFIG" 2>&1 | grep -q 'hyu-premium-media'; then
            echo 'R2 bucket already exists.'
          else
            npx --yes wrangler@latest r2 bucket create hyu-premium-media --config "$WRANGLER_CONFIG"
          fi

      - name: Deploy R2 media worker
        shell: bash
        run: npx --yes wrangler@latest deploy --config "$WRANGLER_CONFIG"

      - name: Resolve Workers public URL
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          json=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          subdomain=$(printf '%s' "$json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(2);process.stdout.write(j.result.subdomain)})")
          base="https://hyu-premium-media.${subdomain}.workers.dev"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          curl -fsS "$base/health"

      - name: Install one-time migration credential
        id: migration_key
        shell: bash
        run: |
          set -euo pipefail
          key=$(openssl rand -hex 32)
          printf '%s' "$key" | npx --yes wrangler@latest secret put MIGRATION_KEY --config "$WRANGLER_CONFIG"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Copy first-party media to R2 and generate GitHub metadata
        shell: bash
        env:
          R2_PUBLIC_BASE_URL: ${{ steps.worker.outputs.base }}
          R2_MIGRATION_KEY: ${{ steps.migration_key.outputs.key }}
        run: node scripts/migrate-supabase-to-r2.mjs

      - name: Finalize GitHub source-of-truth snapshot
        shell: bash
        run: node scripts/finalize-github-backend.mjs

      - name: Verify generated backend snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s data/backend/catalogue.json
          test -s data/backend/team.json
          test -s data/backend/seo.json
          test -s data/backend/storage.json
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('data/backend/catalogue.json','utf8'));
          const s=JSON.parse(fs.readFileSync('data/backend/storage.json','utf8'));
          if(c.ready!==true||s.ready!==true) throw new Error('Backend snapshot was not marked ready.');
          if(!Array.isArray(c.items)||c.items.length<100) throw new Error('Catalogue snapshot is unexpectedly small.');
          if(!c.ownerOptions||!Array.isArray(c.ownerOptions.categories)||!Array.isArray(c.ownerOptions.ranks)||!Array.isArray(c.ownerOptions.credits)) throw new Error('Owner option metadata is incomplete.');
          if(!String(s.publicBaseUrl||'').includes('workers.dev')) throw new Error('R2 public URL was not generated.');
          const supabaseMedia=c.items.filter(x=>/\.supabase\.co\/storage\/v1\/object\/public\//i.test(String(x.image||''))||/\.supabase\.co\/storage\/v1\/object\/public\//i.test(String(x.thumbnail||'')));
          if(supabaseMedia.length) throw new Error(`Found ${supabaseMedia.length} catalogue items still using Supabase Storage.`);
          console.log({items:c.items.length,hidden:c.items.filter(x=>x.hidden).length,r2Objects:s.migratedObjects,ownerOptions:c.ownerOptions,publicBaseUrl:s.publicBaseUrl});
          NODE

      - name: Remove one-time migration credential
        if: always() && steps.migration_key.outputs.key != ''
        shell: bash
        run: npx --yes wrangler@latest secret delete MIGRATION_KEY --config "$WRANGLER_CONFIG" --yes || true

      - name: Commit migrated metadata to migration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backend/catalogue.json data/backend/team.json data/backend/seo.json data/backend/publish-gates.json data/backend/storage.json
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'chore(migration): snapshot GitHub metadata after R2 copy [r2-migration-data]'
          git push origin HEAD:${{ github.ref_name }}
