name: Build taxonomy covers

on:
  push:
    branches:
      - feat/taxonomy-covers

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/taxonomy-covers
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Egress regression gate
        run: npm run egress:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build admin bundle
        run: npm run admin:build
      - name: Assert representative controls and gallery UX
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Artwork đại diện" assets/js/admin-github.bundle.js
          grep -q "taxonomy-representative-control" assets/js/admin-github.bundle.js
          grep -q "taxonomy-cover-card" components/TaxonomyGalleryClient.tsx
          grep -q "Admin root element missing" assets/js/admin-github.bundle.js
      - name: Production build
        run: npm run build
      - name: Commit rebuilt admin bundle and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/admin-github.bundle.js
          git rm .github/workflows/build-taxonomy-covers.yml
          git commit -m "chore(admin): build taxonomy representative bundle"
          git push origin HEAD:feat/taxonomy-covers
