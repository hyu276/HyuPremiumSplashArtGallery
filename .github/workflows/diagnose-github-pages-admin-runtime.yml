name: Diagnose GitHub Pages admin runtime

on:
  push:
    branches: [fix/github-pages-admin-runtime-v2]
    paths: ['.github/workflows/diagnose-github-pages-admin-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live GitHub Pages admin and assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://hyu276.github.io/HyuPremiumSplashArtGallery'
          for path in '/admin.html' '/app/admin/admin.css' '/assets/js/admin-github.bundle.js'; do
            echo "===== $base$path ====="
            code=$(curl -sS -L -D /tmp/h -o /tmp/b -w '%{http_code}' "$base$path")
            tr -d '\r' </tmp/h
            echo "status=$code bytes=$(wc -c </tmp/b | tr -d ' ')"
            head -c 300 /tmp/b || true
            echo
          done
      - name: Inspect Vercel admin API CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          url='https://hyupremium.vercel.app/api/admin-backend'
          code=$(curl -sS -D /tmp/h -o /tmp/b -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://hyu276.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization' \
            "$url")
          tr -d '\r' </tmp/h
          echo "status=$code"
          cat /tmp/b || true
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser smoke live admin
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/admin-smoke.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const consoleErrors=[];const pageErrors=[];const failed=[];
          page.on('console',msg=>{if(msg.type()==='error')consoleErrors.push(msg.text())});
          page.on('pageerror',err=>pageErrors.push(String(err.stack||err)));
          page.on('requestfailed',req=>failed.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText||'failed'}`));
          const response=await page.goto('https://hyu276.github.io/HyuPremiumSplashArtGallery/admin.html',{waitUntil:'networkidle',timeout:60000});
          await page.waitForTimeout(1000);
          const snapshot=await page.evaluate(()=>({
            title:document.title,
            bodyText:(document.body?.innerText||'').slice(0,1600),
            rootChildren:document.querySelector('#root')?.children.length||0,
            tokenInput:Boolean(document.querySelector('input[placeholder="github_pat_..."]')),
            buttons:[...document.querySelectorAll('button')].slice(0,8).map(x=>x.textContent?.trim()),
          }));
          console.log(JSON.stringify({status:response?.status(),snapshot,consoleErrors,pageErrors,failed},null,2));
          await page.screenshot({path:'/tmp/admin-live.png',fullPage:true});
          await browser.close();
          if(response?.status()!==200)process.exit(2);
          if(snapshot.rootChildren<1||!snapshot.tokenInput)process.exit(3);
          if(pageErrors.length)process.exit(4);
          NODE
          node /tmp/admin-smoke.mjs
      - name: Upload browser screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-live-smoke
          path: /tmp/admin-live.png
          retention-days: 1
