name: Fix Admin CORS types

on:
  push:
    branches: [fix/github-pages-admin-only]
    paths:
      - 'scripts/fix-admin-cors-types.mjs'
      - '.github/workflows/fix-admin-cors-types.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/github-pages-admin-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fix-admin-cors-types.mjs
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/admin-backend/route.ts
          git commit -m 'fix: type Admin CORS headers explicitly'
          git pull --rebase origin fix/github-pages-admin-only
          git push origin HEAD:fix/github-pages-admin-only
