name: Diagnose workers.dev 302

on:
  push:
    branches: [hardening/egress-no-domain-v2]
    paths: ['.github/workflows/diagnose-workers-dev-302.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect public Worker response headers
        shell: bash
        run: |
          set -euo pipefail
          base='https://hyu-premium-media.csquocnguyen.workers.dev'
          media=$(node -e "const c=require('./data/backend/catalogue.json');const i=c.items.find(x=>!x.hidden&&x.variants?.['640']?.url);process.stdout.write(i.variants['640'].url)")
          for url in "$base/health" "$media"; do
            echo "===== $url ====="
            curl -sS -D - -o /tmp/body "$url" || true
            echo '--- body preview ---'
            head -c 600 /tmp/body || true
            echo
          done
