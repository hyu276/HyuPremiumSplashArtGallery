name: Inspect Cloudflare Access

on:
  push:
    branches: [hardening/egress-no-domain-v2]
    paths: ['.github/workflows/inspect-cloudflare-access.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: List Access applications safely
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/apps.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps")
          echo "HTTP=$code"
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/apps.json','utf8'));
          console.log(JSON.stringify({success:j.success,errors:j.errors,result:(j.result||[]).map(x=>({id:x.id,name:x.name,type:x.type,domain:x.domain,app_launcher_visible:x.app_launcher_visible,destinations:x.destinations,policies:(x.policies||[]).map(p=>({id:p.id,name:p.name,decision:p.decision}))}))},null,2));
          NODE
          test "$code" = "200"
