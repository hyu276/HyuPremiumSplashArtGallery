name: Deploy HYU R2 media worker

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/r2-media-worker/**'
      - '.github/workflows/deploy-r2-media-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyu-r2-media-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_WRANGLER_CONFIG: cloudflare/r2-media-worker/wrangler.jsonc
      V2_WRANGLER_CONFIG: cloudflare/r2-media-worker/wrangler.v2.jsonc
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - name: Deploy legacy production worker
        shell: bash
        run: npx --yes wrangler@latest deploy --config "$PUBLIC_WRANGLER_CONFIG"
      - name: Deploy v2 production worker
        shell: bash
        run: npx --yes wrangler@latest deploy --config "$V2_WRANGLER_CONFIG"
      - name: Resolve production Worker URLs
        shell: bash
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          subdomain=$(printf '%s' "$json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(2);process.stdout.write(j.result.subdomain)})")
          legacy="https://hyu-premium-media.${subdomain}.workers.dev"
          v2="https://hyu-premium-media-v2.${subdomain}.workers.dev"
          source=$(node -e "const c=require('./data/backend/catalogue.json');const i=c.items.find(x=>!x.hidden&&x.variants?.['640']?.url);if(!i)process.exit(2);process.stdout.write(i.variants['640'].url)")
          pathname=$(SOURCE="$source" node -e "process.stdout.write(new URL(process.env.SOURCE).pathname)")
          echo "LEGACY_BASE=$legacy" >> "$GITHUB_ENV"
          echo "V2_BASE=$v2" >> "$GITHUB_ENV"
          echo "LEGACY_MEDIA_URL=$legacy$pathname" >> "$GITHUB_ENV"
          echo "V2_MEDIA_URL=$v2$pathname" >> "$GITHUB_ENV"
          echo "Legacy Worker: $legacy"
          echo "V2 Worker: $v2"
      - name: Verify v2 Worker health and CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          probe="$V2_BASE/admin/media/diagnostics/preflight.webp"
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/v2-health -w '%{http_code}' "$V2_BASE/health")
            curl -sS -o /dev/null -D /tmp/v2-preflight -X OPTIONS "$probe" \
              -H 'Origin: https://hyu276.github.io' \
              -H 'Access-Control-Request-Method: PUT' \
              -H 'Access-Control-Request-Headers: authorization,content-type'
            preflight=$(tr -d '\r' </tmp/v2-preflight | awk 'NR==1{print $2}')
            allow_origin=$(tr -d '\r' </tmp/v2-preflight | awk 'BEGIN{IGNORECASE=1}/^access-control-allow-origin:/{sub(/^access-control-allow-origin:[[:space:]]*/,"");print}' | tail -1)
            echo "attempt=$attempt health=$code preflight=${preflight:-missing} allow-origin=${allow_origin:-missing}"
            if [ "$code" = "200" ] && [ "$preflight" = "204" ] && [ "$allow_origin" = "https://hyu276.github.io" ]; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = "1" || { echo '::error::V2 Worker health/CORS preflight did not become reachable'; exit 1; }
      - name: Verify v2 admin PUT reaches Worker without Cloudflare Access redirect
        shell: bash
        run: |
          set -euo pipefail
          probe="$V2_BASE/admin/media/diagnostics/unauthorized-probe.webp"
          code=$(printf 'probe' | curl -sS -o /tmp/v2-put-body -D /tmp/v2-put-headers -w '%{http_code}' -X PUT "$probe" \
            -H 'Origin: https://hyu276.github.io' \
            -H 'Content-Type: application/octet-stream' \
            --data-binary @-)
          tr -d '\r' </tmp/v2-put-headers
          test "$code" = "401" || { echo "::error::Expected Worker-auth 401, got $code"; exit 1; }
          tr -d '\r' </tmp/v2-put-headers | grep -Eiq '^access-control-allow-origin: https://hyu276.github.io$'
          grep -q 'GitHub token required' /tmp/v2-put-body
      - name: Verify v2 Cloudflare cache HIT
        shell: bash
        run: |
          set -euo pipefail
          hit=0
          for attempt in $(seq 1 12); do
            curl -fsS -D /tmp/v2-media-headers -o /dev/null "$V2_MEDIA_URL"
            status=$(tr -d '\r' </tmp/v2-media-headers | awk 'BEGIN{IGNORECASE=1}/^cf-cache-status:/{print $2}' | tail -1)
            echo "attempt=$attempt cf-cache-status=${status:-missing}"
            if [ "$status" = "HIT" ]; then hit=1; break; fi
            sleep 1
          done
          test "$hit" = "1" || { echo '::error::V2 media never produced CF-Cache-Status: HIT'; exit 1; }
      - name: Verify legacy Worker remains healthy
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/legacy-health -w '%{http_code}' "$LEGACY_BASE/health")
            echo "attempt=$attempt status=$code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = "1" || { echo '::error::Legacy Worker is not publicly reachable'; exit 1; }
      - name: Verify legacy Range 206 semantics
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/range-headers -H 'Range: bytes=0-1023' -o /tmp/range-body "$LEGACY_MEDIA_URL"
          tr -d '\r' </tmp/range-headers | grep -Eq '^HTTP/[0-9.]+ 206'
          tr -d '\r' </tmp/range-headers | grep -Eiq '^content-range: bytes 0-1023/'
          test "$(wc -c </tmp/range-body | tr -d ' ')" = "1024"
      - name: Verify v2 query canonicalization
        shell: bash
        run: |
          set -euo pipefail
          probe="${V2_MEDIA_URL}?cache_bust=$(date +%s%N)"
          curl -sS -D /tmp/query-headers -o /dev/null "$probe"
          tr -d '\r' </tmp/query-headers | grep -Eq '^HTTP/[0-9.]+ 308'
          location=$(tr -d '\r' </tmp/query-headers | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^location:[[:space:]]*/,"");print}' | tail -1)
          test "$location" = "$V2_MEDIA_URL" || { echo "::error::Expected canonical Location $V2_MEDIA_URL but got $location"; exit 1; }
          echo 'V2 CORS, auth boundary, cache HIT, Range compatibility, and query canonicalization verified.'
